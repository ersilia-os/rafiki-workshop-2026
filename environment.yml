## The only dependency file. Streamlit Community Cloud is the deployment target.
##
## conda rather than pip: rdkit's PyPI wheel links against libXrender and
## libXext, which would need a packages.txt apt step, and Community Cloud's apt
## fails on an expired Debian release file. conda-forge's rdkit brings those
## libraries with it.
##
## `nodefaults` matters. Community Cloud appends the `defaults` channel, and
## these versions do not exist there, so the solver searches both channels and
## stalls. This pins the search to conda-forge alone.
##
## Versions resolved on linux-64, the platform Community Cloud runs.
name: rafiki-workshop-2026
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.16
  - streamlit=1.63.0
  - pandas=3.0.5
  - numpy=2.4.6
  - rdkit=2026.3.6
  - altair=6.2.2
  - scikit-learn=1.9.0
