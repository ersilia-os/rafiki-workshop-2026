[theme]
base = "light"

# Ersilia house web design system (ersilia-skills/skills/html-formatting).
# Plum #50285A is identity and stays out of the chrome: logo, favicon, and the
# reference lines on the charts. Periwinkle carries every interaction.
backgroundColor = "#FAFAFC"
secondaryBackgroundColor = "#F4F4F8"
textColor = "#2C3E50"
primaryColor = "#6C5CE7"   # periwinkle: buttons, sliders, anything you can press.
linkColor = "#6C5CE7"
linkUnderline = false
borderColor = "#E6E6EE"
showWidgetBorder = true
showSidebarBorder = true

baseRadius = "0.75rem"
buttonRadius = "0.5rem"
baseFontSize = 15
font = "system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
headingFontSizes = ["2rem", "1.5rem", "1.3rem", "1.05rem", "0.95rem", "0.85rem"]
headingFontWeights = [700, 600, 600, 500, 500, 500]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600
dataframeHeaderBackgroundColor = "#F4F4F8"
dataframeBorderColor = "#E6E6EE"

# Brand hues snapped for legibility; red sits in slot 6 by design.
chartCategoricalColors = ["#6d5de7", "#e2a72e", "#247dad", "#6cbf5a", "#af5cc7", "#e63745"]
# Streamlit requires exactly 10 stops; interpolated from the design system's 5.
chartSequentialColors = [
    "#b2b4d7",
    "#a5a6d4",
    "#9798d2",
    "#8b8bcf",
    "#7e7dcc",
    "#726fc8",
    "#6760c5",
    "#5d51c1",
    "#533fbc",
    "#492eb8",
]

# st.info would otherwise use Streamlit's own blue, the one colour on screen
# that belongs to no palette. Cobalt is the house data hue.
blueColor = "#247dad"
greenColor = "#3F9D6B"
orangeColor = "#C98A1E"
redColor = "#D9534F"
violetColor = "#6C5CE7"

[theme.sidebar]
# White, so the sidebar reads as a panel against the page ground - the same
# surface/ground relationship the cards use.
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F8"

[client]
# Hide "Deploy" and the developer menu. Neither means anything to a workshop
# attendee, and Streamlit's own dropdown cannot be themed to match the app.
toolbarMode = "minimal"
